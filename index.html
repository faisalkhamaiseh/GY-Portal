    <script>
      // Runs before first paint: open the saved language, and flag the one-time
      // disclaimer so CSS can show it without waiting for JavaScript.
      ;(function () {
        var d = document.documentElement
        try {
          var lang = localStorage.getItem('gy-lang')
          var p = location.pathname
          var en = p === '/en' || p.indexOf('/en/') === 0
          if (lang === 'en' && !en) return location.replace((p === '/' ? '/en' : '/en' + p) + location.search + location.hash)
          if (lang === 'ar' && en) return location.replace((p.slice(3) || '/') + location.search + location.hash)
          if (localStorage.getItem('gy-disclaimer-accepted') !== '1') d.dataset.disclaimer = '1'
        } catch (e) {
          d.dataset.disclaimer = '1'
        }
      })()
    </script>
    <!--head-->
  </head>
  <body>
    <div id="root"><!--app--></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
