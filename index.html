    <script>
      // Runs before first paint, in plain ES5 so it works on every phone:
      // open the saved language, and flag the one-time disclaimer so CSS can
      // show it without waiting for the app. Its button works even if the app
      // script fails to load, so the disclaimer can never trap a visitor.
      ;(function () {
        var d = document.documentElement
        try {
          var lang = localStorage.getItem('gy-lang')
          var p = location.pathname
          var en = p === '/en' || p === '/en/' || p.indexOf('/en/') === 0
          if (lang === 'en' && !en) return location.replace((p === '/' ? '/en' : '/en' + p) + location.search + location.hash)
          if (lang === 'ar' && en) return location.replace((p.slice(3) || '/') + location.search + location.hash)
          if (localStorage.getItem('gy-disclaimer-accepted') !== '1') d.setAttribute('data-disclaimer', '1')
        } catch (e) {
          d.setAttribute('data-disclaimer', '1')
        }
        document.addEventListener('click', function (e) {
          for (var t = e.target; t && t.getAttribute; t = t.parentNode) {
            if (t.getAttribute('data-accept-disclaimer') !== null) {
              try {
                localStorage.setItem('gy-disclaimer-accepted', '1')
              } catch (x) {}
              d.removeAttribute('data-disclaimer')
              return
            }
          }
        })
      })()
    </script>
    <!--head-->
  </head>
  <body>
    <div id="root"><!--app--></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
